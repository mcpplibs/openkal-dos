# A DOS program in C++23 over openkal-dos (technical experiment only): sorts its arguments, throws
# and catches an exception across a frame, reads PATH and returns 7.
#   mcpp run --target i686-dos-musl -- b a
[package]
name    = "hello"
version = "0.1.0"

[targets.hello]
kind = "bin"
main = "src/main.cpp"

[target.i686-dos-musl]
platform = "openkal-platform@0.28.0"
